name: Release APK

# Publishes a downloadable APK on the repository's Releases page, which is a
# nicer link to open from a phone than a build artifact -- and unlike an
# artifact, it does not expire.
#
# Either tag a commit:
#   git tag v1.0.0 && git push origin v1.0.0
# or run this from the Actions tab and give it the version, which creates the
# tag here. That second way exists because pushing a tag needs credentials
# that a branch-scoped checkout does not have.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version to release, e.g. v1.0.0
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Name the APK after the tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/tcg-decks-${TAG}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
