name: Release

# Publishes downloadable builds on the repository's Releases page, which is a
# nicer link to open from a phone than a build artifact -- and unlike an
# artifact, it does not expire.
#
# Either tag a commit:
#   git tag v1.0.0 && git push origin v1.0.0
# or run this from the Actions tab and give it the version, which creates the
# tag here. That second way exists because pushing a tag needs credentials
# that a branch-scoped checkout does not have.
#
# The Android build publishes the release; the Windows build adds its zip to
# it afterwards. Each uploads straight to the release rather than handing a
# file to a later job, because passing files between jobs goes through Actions
# artifact storage, and a full quota there would take the release down with
# it. A Windows build that fails costs the zip and nothing else: the APK is
# already published, and the failure is on the run for anyone to read.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version to release, e.g. v1.0.0
        required: true
        default: v1.0.0

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      - name: Build release APK
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        # APP_VERSION is what the app shows in its settings, so an
        # installed build can say which release it is.
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --build-name="${TAG#v}" \
            --dart-define=APP_VERSION="${TAG}"

      - name: Name the APK after the tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/vanguard-simulator-${TAG}.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true

  windows:
    # After the release exists, so this only ever adds a file to it. Running
    # the two side by side would have them both try to create it.
    needs: android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build the Windows app
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          flutter build windows --release \
            --build-number=${{ github.run_number }} \
            --build-name="${TAG#v}" \
            --dart-define=APP_VERSION="${TAG}"

      - name: Package it
        shell: pwsh
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: ./tool/package_windows.ps1 -Name "vanguard-simulator-$env:TAG-windows-x64"

      - name: Add it to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*.zip
