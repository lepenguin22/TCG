name: Refresh card database

# Reads any new sets from Bushiroad's official card list, regenerates the
# bundled card catalog, and opens a pull request when new cards have appeared.
# Run it from the Actions tab after a set releases, or let the monthly schedule
# pick things up.
#
# The scrape runs here rather than locally because the card list is unreachable
# from the environment this app is developed in -- and because it answers 404
# to anything that does not look like a browser, which is what made an earlier
# community mirror of it stop dead at DZ-BT09 and take the database with it.
on:
  workflow_dispatch:
    inputs:
      expansions:
        description: >-
          Specific expansion numbers to read, space separated. Leave empty to
          read everything the mirror does not have. Use this to pick up a set
          the mirror numbered differently, or to re-read one after an errata.
        required: false
        default: ''
      cards:
        description: >-
          Specific card numbers to read, space separated, e.g. "PR/1020EN".
          For the promos no set sweep reaches. Given on their own, only these
          are read.
        required: false
        default: ''
      search:
        description: >-
          Look a card up by name and print what the site has, writing nothing.
          For finding the number a card is really filed under.
        required: false
        default: ''
      dump:
        description: >-
          Print the pages the cards above read as, line by line, before the
          parse. For working out why a card came out with the wrong stats.
        required: false
        default: ''
      dry_run:
        description: >-
          Read the cards and stop: no rebuild, no tests, no commit. For
          working out why a card will not read.
        required: false
        default: ''
      push_to_branch:
        description: >-
          Branch to commit the regenerated files straight to. Leave empty to
          open a pull request instead.
        required: false
        default: ''
  schedule:
    # 04:00 UTC on the 1st of each month.
    - cron: '0 4 1 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Read any sets the catalog does not have
        env:
          EXPANSIONS: ${{ inputs.expansions }}
          CARDS: ${{ inputs.cards }}
          SEARCH: ${{ inputs.search }}
          DUMP: ${{ inputs.dump }}
        run: |
          if [ -n "$SEARCH" ]; then
            python3 tool/scrape_cardlist.py --search "$SEARCH"
            exit 0
          fi
          args=""
          for n in $EXPANSIONS; do
            args="$args --expansion $n"
          done
          for c in $CARDS; do
            args="$args --card $c"
          done
          if [ -n "$DUMP" ]; then
            args="$args --dump"
          fi
          if [ -n "$args" ]; then
            echo "reading only:$args"
            python3 tool/scrape_cardlist.py $args
          else
            python3 tool/scrape_cardlist.py --from-expansion 243
          fi

      - name: Rebuild the catalog
        if: inputs.search == '' && inputs.dry_run == ''
        run: dart run tool/build_catalog.dart

      # The catalog feeds the deck rules, so a bad regeneration must not reach
      # a pull request: these are the same checks the APK build runs.
      - name: Verify the new catalog
        if: inputs.search == '' && inputs.dry_run == ''
        run: flutter test test/card_catalog_test.dart

      # Straight onto a branch when one is named: a single promo picked up by
      # number does not need a pull request of its own.
      - name: Push to the branch that asked for it
        if: inputs.push_to_branch != '' && inputs.search == '' && inputs.dry_run == ''
        env:
          BRANCH: ${{ inputs.push_to_branch }}
        run: |
          if git diff --quiet -- assets/cards data/cardlist; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards data/cardlist
          git commit -m "Refresh the bundled card database

          Read from the official card list by tool/scrape_cardlist.py and
          regenerated by tool/build_catalog.dart."
          # Onto the branch this run was dispatched from. A branch that has
          # moved since fails here rather than being overwritten.
          git push origin "HEAD:$BRANCH"

      - name: Open a pull request if anything changed
        if: inputs.push_to_branch == '' && inputs.search == '' && inputs.dry_run == ''
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/refresh-card-database
          title: Refresh the bundled card database
          commit-message: |
            Refresh the bundled card database

            Read from the official card list by tool/scrape_cardlist.py and
            regenerated by tool/build_catalog.dart.
          body: |
            Read any new sets from Bushiroad's official card list into
            `data/cardlist/extra_sets.json`, then regenerated
            `assets/cards/vanguard.json` from those and the community mirror
            of everything older. `test/card_catalog_test.dart` passed against
            the new file, so every entry still carries a name, grade and card
            type the rules engine understands.

            Merging this rebuilds the APK with the new cards in it.
          add-paths: |
            assets/cards/
            data/cardlist/
          delete-branch: true
