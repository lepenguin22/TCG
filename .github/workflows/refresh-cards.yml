name: Refresh card database

# Reads any new sets from Bushiroad's official card list, regenerates the
# bundled card catalog, and opens a pull request when new cards have appeared.
# Run it from the Actions tab after a set releases, or let the monthly schedule
# pick things up.
#
# The scrape runs here rather than locally because the card list is unreachable
# from the environment this app is developed in -- and because it answers 404
# to anything that does not look like a browser, which is what made an earlier
# community mirror of it stop dead at DZ-BT09 and take the database with it.
on:
  workflow_dispatch:
  schedule:
    # 04:00 UTC on the 1st of each month.
    - cron: '0 4 1 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Read any sets the catalog does not have
        run: python3 tool/scrape_cardlist.py --from-expansion 243

      - name: Rebuild the catalog
        run: dart run tool/build_catalog.dart

      # The catalog feeds the deck rules, so a bad regeneration must not reach
      # a pull request: these are the same checks the APK build runs.
      - name: Verify the new catalog
        run: flutter test test/card_catalog_test.dart

      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/refresh-card-database
          title: Refresh the bundled card database
          commit-message: |
            Refresh the bundled card database

            Read from the official card list by tool/scrape_cardlist.py and
            regenerated by tool/build_catalog.dart.
          body: |
            Read any new sets from Bushiroad's official card list into
            `assets/cards/extra_sets.json`, then regenerated
            `assets/cards/vanguard.json` from those and the community mirror
            of everything older. `test/card_catalog_test.dart` passed against
            the new file, so every entry still carries a name, grade and card
            type the rules engine understands.

            Merging this rebuilds the APK with the new cards in it.
          add-paths: assets/cards/
          delete-branch: true
