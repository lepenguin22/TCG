# Iterating on the scraper: the site is unreachable from where it is written,
# so a runner tries it and the log is the feedback. Removed once it is proven.
name: Probe card list

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read one recent set
        run: python3 tool/scrape_cardlist.py --expansion 257 --limit 12
