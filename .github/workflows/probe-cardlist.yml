# A one-off diagnostic, not part of the build. Removed once it has answered.
name: Probe card list

on:
  workflow_dispatch:
    inputs:
      deck_code:
        description: A public Deck Log code to dump
        required: false
        default: '19RVZ6'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Where does the card list live now?
        run: |
          for url in "https://en.cf-vanguard.com/" "https://cf-vanguard.com/"; do
            echo "=== $url"
            curl -sSL -m 30 -o /tmp/p.html -w "final=%{url_effective} http=%{http_code} bytes=%{size_download}\n" "$url" || echo FAILED
          done
          echo "--- cardlist links on the english home page ---"
          curl -sSL -m 45 -o /tmp/home.html "https://en.cf-vanguard.com/" || true
          grep -oE 'https?://[^"]*cardlist[^"]*' /tmp/home.html | sort -u | head -20 || true

      - name: What does a Deck Log payload actually look like?
        run: python3 tool/probe_decklog.py "${{ inputs.deck_code }}"
