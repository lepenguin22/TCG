name: Build APK

# Every push builds an installable APK and attaches it to the run. Download it
# from the run's "Artifacts" section, copy it to your phone and open it.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Gradle only reaches the manifest five minutes into the build, and a
      # malformed one fails there. Catching it here costs a second.
      - name: Validate Android XML
        run: |
          python3 - <<'PY'
          import glob, sys, xml.dom.minidom
          bad = []
          files = glob.glob('android/**/*.xml', recursive=True)
          for path in files:
              try:
                  xml.dom.minidom.parse(path)
              except Exception as error:
                  bad.append(f'{path}: {error}')
          print(f'checked {len(files)} files')
          if bad:
              print('\n'.join(bad), file=sys.stderr)
              sys.exit(1)
          PY

      # The build number becomes the Android versionCode, so a newer build
      # always installs over an older one instead of being refused.
      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_VERSION="build ${{ github.run_number }}"

      - name: Name the APK after the commit
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/vanguard-simulator-${GITHUB_SHA::7}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: vanguard-simulator-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90
