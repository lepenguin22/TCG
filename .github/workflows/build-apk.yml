name: Build APK

# Every push builds the Android app, to prove it still builds. The APK is not
# kept: an installable one comes from tagging a release, which publishes it on
# the Releases page where it does not expire and is a link a phone can open.
#
# It used to be attached to the run as an artifact. Artifacts are charged
# against a storage allowance the whole account shares, a 55MB APK on every
# push filled it, and the upload then failed on every run -- which turned a
# build that passed into a red cross, and a red cross nobody reads is worse
# than not keeping the file.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Gradle only reaches the manifest five minutes into the build, and a
      # malformed one fails there. Catching it here costs a second.
      - name: Validate Android XML
        run: |
          python3 - <<'PY'
          import glob, sys, xml.dom.minidom
          bad = []
          files = glob.glob('android/**/*.xml', recursive=True)
          for path in files:
              try:
                  xml.dom.minidom.parse(path)
              except Exception as error:
                  bad.append(f'{path}: {error}')
          print(f'checked {len(files)} files')
          if bad:
              print('\n'.join(bad), file=sys.stderr)
              sys.exit(1)
          PY

      # The build number becomes the Android versionCode, so a newer build
      # always installs over an older one instead of being refused.
      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_VERSION="build ${{ github.run_number }}"

      - name: Say how big it came out
        run: ls -lh build/app/outputs/flutter-apk/app-release.apk
