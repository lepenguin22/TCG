name: Build Windows

# Every push builds and packages the Windows app, to prove both still work.
# The zip is not kept -- a release publishes one, and artifact storage is an
# allowance the whole account shares -- but it is still built here, because
# zipping it is what a release does, and a packaging script that broke would
# otherwise be found by a release that failed.
#
# It is a separate workflow rather than another job in the APK one so that
# neither can hide the other's failure: a Windows compiler error should not
# look like a broken Android build.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  build:
    # A Windows binary cannot be cross-compiled, so this is the one job in the
    # repository that needs a Windows machine.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build the app
        run: >
          flutter build windows --release
          --build-number=${{ github.run_number }}
          --dart-define=APP_VERSION="build ${{ github.run_number }}"

      - name: Package it
        shell: pwsh
        run: ./tool/package_windows.ps1 -Name "vanguard-simulator-$($env:GITHUB_SHA.Substring(0,7))-windows-x64"
